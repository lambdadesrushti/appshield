version: "3.9"

services:
  # Trains the model and saves it to the shared ./model folder.
  # Runs once, then exits.
  trainer:
    build: .
    command: python train_model.py
    volumes:
      - ./data:/app/data
      - ./model:/app/model

  # Serves the interactive dashboard. Reads the model the trainer produced.
  dashboard:
    build: .
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./model:/app/model
    depends_on:
      - trainer
